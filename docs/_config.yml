# GitHub Pages config for Questline's legal pages.
#
# Custom layout + CSS in this docs/ folder, no external theme — keeps
# the parchment + Cinzel-and-EB-Garamond look consistent with the app.
#
# Output URLs:
#   https://mitchelprice93-stack.github.io/Questline/         (landing)
#   https://mitchelprice93-stack.github.io/Questline/privacy/
#   https://mitchelprice93-stack.github.io/Questline/terms/

title: Questline
description: Your life, as a quest.

# The repo serves at /Questline/ since it's not a user-page repo.
# Jekyll needs to know that for absolute links / asset paths.
baseurl: /Questline
url: https://mitchelprice93-stack.github.io

# Pretty URLs without the .html suffix.
permalink: pretty

# Don't try to render top-level repo files; just the docs/ folder.
exclude:
  - README.md
  - LICENSE

# GitHub Pages requires this plugin set; harmless to declare even
# though we're not using a remote theme.
plugins:
  - jekyll-relative-links

# Render *.md files in the layout we define in _layouts/default.html.
defaults:
  - scope:
      path: ""
    values:
      layout: default
